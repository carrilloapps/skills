name: Validate Skill Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  validate:
    name: Run validate.sh
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Make validate.sh executable
        run: chmod +x scripts/validate.sh

      - name: Run skill quality checks
        run: bash scripts/validate.sh
      - name: Test guard classifier and adapters
        run: node --test integrations/core/core.test.mjs integrations/*/test/*.test.mjs

  scripts-parity:
    name: Script parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Vendored shared scripts in sync
        shell: bash
        run: bash shared/sync.sh --check

      - name: Parity tests (bash)
        shell: bash
        run: |
          if [ -f tests/scripts/run-parity.sh ]; then bash tests/scripts/run-parity.sh; else echo "no bash parity runner"; fi

      - name: Parity tests (PowerShell 7)
        shell: pwsh
        run: |
          if (Test-Path tests/scripts/run-parity.ps1) { ./tests/scripts/run-parity.ps1; if ($LASTEXITCODE) { exit $LASTEXITCODE } } else { 'no pwsh parity runner' }

      - name: Parity tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (Test-Path tests/scripts/run-parity.ps1) { & ./tests/scripts/run-parity.ps1; if ($LASTEXITCODE) { exit $LASTEXITCODE } } else { 'no parity runner' }

      - name: agentic-agile end-to-end example (every available shell)
        shell: bash
        run: bash tests/scripts/run-e2e.sh

  skills-audit:
    # Local equivalents of the skills.sh audits that can run offline:
    # agentskills validate (Agent Skills spec) + Cisco skill-scanner (no --use-llm / --use-virustotal,
    # so skill content never leaves the runner). Fails on any validator error or scanner finding.
    name: Skills audit (agentskills validate + skill-scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload to code scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Agent Skills spec validation
        run: |
          rc=0
          for d in skills/*/; do
            uvx --python 3.13 --from skills-ref==0.1.1 agentskills validate "$d" || rc=1
          done
          exit "$rc"

      - name: Cisco skill-scanner (offline analyzers)
        run: |
          uvx --python 3.13 --from cisco-ai-skill-scanner==2.2.1 skill-scanner scan-all skills \
            --recursive --use-behavioral --format sarif --output skill-scanner.sarif
          uvx --python 3.13 --from cisco-ai-skill-scanner==2.2.1 skill-scanner scan-all skills \
            --recursive --use-behavioral --format json --output skill-scanner.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open("skill-scanner.json", encoding="utf-8"))
          findings = [(r["skill_name"], f) for r in data.get("results", []) for f in r.get("findings", [])]
          for i, (skill, f) in enumerate(findings, 1):
              print(f"{i}. {f.get('severity')} {f.get('rule_id')} {skill}/{f.get('file_path')}:{f.get('line_number')}")
          print(f"skill-scanner findings: {len(findings)}")
          sys.exit(1 if findings else 0)
          PY

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('skill-scanner.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: skill-scanner.sarif
          category: skill-scanner
