name: Snyk agent-scan (manual, pre-publish)

# MANUAL ONLY. This job UPLOADS THE CONTENT OF THE SKILLS to Snyk's API for analysis
# (secrets are redacted by the tool first). It is the same engine skills.sh uses for its Snyk audit.
# Requires the repository secret SNYK_TOKEN. Daily quota limits apply; run it before publishing,
# not on every pull request.

on:
  workflow_dispatch:

permissions: {}

jobs:
  snyk-agent-scan:
    name: Snyk agent-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Scan skills with Snyk agent-scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$SNYK_TOKEN" ]; then echo "SNYK_TOKEN secret is not set" >&2; exit 1; fi
          # One scan only (each run uploads content and counts against the Snyk daily quota);
          # --json (documented flag) goes to the log and to an artifact. Non-zero exit = findings.
          uvx --python 3.13 snyk-agent-scan==0.6.8 skills --json | tee snyk-agent-scan.json

      - name: Upload JSON report
        if: always() && hashFiles('snyk-agent-scan.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: snyk-agent-scan
          path: snyk-agent-scan.json
          retention-days: 30
